{% extends "layout.html" %}

{% block title %}Kirjat{% endblock %}

{% block content %}

<h1>Kaikki kirjat</h1>

<form action="/books" method="get">
  <input type="text" name="search" placeholder="Hae kirjoja">
  <input type="submit" value="Hae">
</form>

{% for book in books %}
  <h2><a href="/book/{{ book.id }}">{{ book.title }}</a></h2>
  <p>Tekijä: {{ book.author }}</p>
  <p>Vuosi: {{ book.year }}</p>

  <hr>
{% endfor %}

{% endblock %}
