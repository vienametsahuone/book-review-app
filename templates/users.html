{% extends "layout.html" %}

{% block title %}Käyttäjät{% endblock %}


{% block content %}

<h1>Käyttäjät</h1>

<div class="users-table-box">
    <table class="users-table">
        <tr>
            <th>Käyttäjä</th>
            <th>Lisätyt kirjat</th>
            <th>Kirjoitetut arvostelut</th>
        </tr>

        {% for user in users %}
            <tr>
                <td>
                    <a href="/user/{{ user.id }}">{{ user.username }}</a>
                </td>
                <td>{{ user.books_added }}</td>
                <td>{{ user.reviews_written }}</td>
            </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
